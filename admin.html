<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Résultats des votes (privé)</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --border:#2a2f3a; --text:#f2f2f2;
    --muted:#9aa3af; --accent:#d4af37;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); padding:2rem 1rem;
  }
  .wrap{max-width:900px;margin:0 auto;}
  h1{font-size:1.4rem;margin-bottom:.25rem;}
  .sub{color:var(--muted);font-size:.9rem;margin-bottom:1.5rem;}
  .warning{
    background:#3a2a1a;border:1px solid #6b4a1e;color:#f2d9a8;
    padding:.75rem 1rem;border-radius:8px;font-size:.85rem;margin-bottom:1.5rem;
  }
  .toolbar{display:flex;gap:.75rem;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;}
  button{
    background:var(--accent);color:#1a1a1a;border:none;border-radius:8px;
    padding:.6rem 1.1rem;font-weight:600;cursor:pointer;font-size:.9rem;
  }
  button:disabled{opacity:.5;cursor:default;}
  button.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
  .total{font-size:.9rem;color:var(--muted);}
  .total b{color:var(--text);font-size:1.1rem;}
  .cat{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:1rem 1.25rem;margin-bottom:1rem;
  }
  .cat h2{font-size:1rem;margin:0 0 .75rem;color:var(--accent);}
  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:500;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em;}
  td.votes{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
  tr.winner td{color:var(--accent);}
  .loading{color:var(--muted);font-size:.85rem;}
  .err{color:#e57373;font-size:.85rem;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Résultats des votes — Icône du Franco-Arabe</h1>
  <div class="sub">Page privée, non reliée au site public. Ne pas partager ce lien.</div>
  <div class="warning">Cette page lit les compteurs en temps réel. Recharge-la à tout moment pour voir les derniers votes.</div>

  <div class="toolbar">
    <button id="refreshBtn" onclick="loadAll()">Actualiser</button>
    <button class="secondary" id="csvBtn" onclick="downloadCSV()" disabled>Télécharger en CSV</button>
    <span class="total" id="totalLine"></span>
  </div>

  <div id="content"><p class="loading">Chargement des résultats…</p></div>
</div>

<script>
const CATEGORIES = [
  { name:"Entreprenariat & Business",
    candidates:["Elhadj Abdoul Gadiry Barry","Aboubacar Koita","Mohamed Sacko"] },
  { name:"Banque & Finance",
    candidates:["Alpha Ousmane Bah","Adama Berete","Abdoul Karim Camara"] },
  { name:"Diplomatie & Relations Internationales",
    candidates:["S.E.M. Sekou Camara","S.E.M. Thierno Abdoulaye Sow","S.E.M. Sékou Chérifké Camara"] },
  { name:"Administration, Droit et Magistrature",
    candidates:["Mohamed Ouattara","Maître Ibrahim Diallo","Mamoudou Diakite"] },
  { name:"Académie, Recherche & Innovation",
    candidates:["Pr Imourane Kaba","Dr Abdourahamane Fadiga","Dr Oumar Sanoh"] },
  { name:"Médias, Communication, Chronique & Information",
    candidates:["Harouna Mariama Sylla","Abdoul Hamid Bangoura","Oumar Barry"] },
  { name:"Paix, Société Civile & Leadership",
    candidates:["Dr Souleymane Niangadou","Aboubacar Koita","Dr Abdoulaye Bah"] },
  { name:"Leadership Féminin, Paix & Éducation",
    candidates:["Mariama Kesso Sow","Dr Amina Diallo","Kadiatou Dioumande"] }
];

function slugify(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

const VOTE_NAMESPACE = 'icone-franco-arabe-ismaelcherif2023-gala2026';
let lastResults = null; // for CSV export

async function getCount(key){
  for(let attempt=0; attempt<3; attempt++){
    try{
      const r = await fetch(`https://abacus.jasoncameron.dev/get/${VOTE_NAMESPACE}/${key}`);
      if(r.status === 404) return 0;
      if(r.status === 429){ await new Promise(res=>setTimeout(res, 400*(attempt+1))); continue; }
      if(!r.ok) return null; // erreur réseau, on ne sait pas
      const d = await r.json();
      return d.value || 0;
    }catch(e){ return null; }
  }
  return null;
}

async function mapLimited(items, limit, fn){
  const results = new Array(items.length);
  let idx = 0;
  async function worker(){
    while(idx < items.length){
      const my = idx++;
      results[my] = await fn(items[my], my);
    }
  }
  await Promise.all(new Array(Math.min(limit, items.length)).fill(0).map(worker));
  return results;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function loadAll(){
  const btn = document.getElementById('refreshBtn');
  const csvBtn = document.getElementById('csvBtn');
  btn.disabled = true;
  csvBtn.disabled = true;
  document.getElementById('content').innerHTML = '<p class="loading">Chargement des résultats…</p>';
  document.getElementById('totalLine').textContent = '';

  const allKeys = [];
  CATEGORIES.forEach((cat, ci)=>{
    const catSlug = slugify(cat.name);
    cat.candidates.forEach((_, di)=> allKeys.push({ci, di, key:`${catSlug}-${di}`}));
  });

  const results = CATEGORIES.map(cat=>({name:cat.name, candidates:cat.candidates.map(name=>({name, votes:null}))}));

  await mapLimited(allKeys, 4, async (item)=>{
    const val = await getCount(item.key);
    results[item.ci].candidates[item.di].votes = val;
  });

  lastResults = results;

  let html = '';
  let grandTotal = 0;
  let hadError = false;

  results.forEach(cat=>{
    const maxVotes = Math.max(...cat.candidates.map(c=> c.votes || 0));
    html += `<div class="cat"><h2>${escapeHtml(cat.name)}</h2><table><thead><tr><th>Candidat</th><th style="text-align:right">Votes</th></tr></thead><tbody>`;
    cat.candidates.forEach(c=>{
      const isWinner = c.votes !== null && c.votes === maxVotes && maxVotes > 0;
      if(c.votes === null){ hadError = true; }
      else{ grandTotal += c.votes; }
      html += `<tr class="${isWinner ? 'winner' : ''}"><td>${escapeHtml(c.name)}</td><td class="votes">${c.votes === null ? '<span class="err">?</span>' : c.votes}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  });

  document.getElementById('content').innerHTML = html;
  document.getElementById('totalLine').innerHTML = `Total des votes : <b>${grandTotal}</b>` + (hadError ? ' <span class="err">(certains chiffres n\'ont pas pu être chargés, réessaie)</span>' : '');

  btn.disabled = false;
  csvBtn.disabled = false;
}

function downloadCSV(){
  if(!lastResults) return;
  let csv = 'Catégorie,Candidat,Votes\n';
  lastResults.forEach(cat=>{
    cat.candidates.forEach(c=>{
      const row = [cat.name, c.name, c.votes === null ? '' : c.votes]
        .map(v => `"${String(v).replace(/"/g,'""')}"`).join(',');
      csv += row + '\n';
    });
  });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0,16).replace('T','_').replace(':','h');
  a.href = url;
  a.download = `resultats-vote-${date}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

loadAll();
</script>
</body>
</html>
